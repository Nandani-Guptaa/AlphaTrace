services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: alphatrace-falkordb
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: alphatrace-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - API_HOST=0.0.0.0
      - API_PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build: .
    container_name: alphatrace-ui
    command: streamlit run ui/dashboard.py --server.port 8501 --server.address 0.0.0.0
    environment:
      - API_URL=http://api:8000/api
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  falkordb_data:
